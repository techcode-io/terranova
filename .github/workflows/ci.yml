---
name: CI

on:
  workflow_call: ~
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Ref: https://docs.astral.sh/uv/concepts/projects/sync/#checking-if-the-lockfile-is-up-to-date
  UV_FROZEN: "true"

## Concurrency only allowed in the main branch.
## So old builds running for old commits within the same Pull Request are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Lint
        run: uv run poe lint

  build:
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - lint
    strategy:
      matrix:
        os:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Build
        run: uv run poe build

      - uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v7
        with:
          name: terranova-tarball-${{ matrix.os.target }}
          path: "dist/*"

  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Install terraform binary
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Test
        run: uv run poe test

  package-deb:
    needs:
      - test
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          name: terranova-tarball-${{ matrix.os.target }}
          path: dist

      - name: Build deb packages
        run: uv run poe package:deb

      - uses: actions/upload-artifact@v7
        with:
          name: terranova-package-deb-${{ matrix.os.target }}
          path: "dist/*.deb"

  package-rpm:
    needs:
      - test
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          name: terranova-tarball-${{ matrix.os.target }}
          path: dist

      - name: Build rpm packages
        run: uv run poe package:rpm

      - uses: actions/upload-artifact@v7
        with:
          name: terranova-package-rpm-${{ matrix.os.target }}
          path: "dist/*.rpm"

  sanitize-deb:
    needs:
      - package-deb
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          name: terranova-package-deb-${{ matrix.os.target }}
          path: dist

      - name: Verify deb amd64 install
        run: |
          sudo dpkg -i dist/terranova*amd64.deb
          sudo apt-get install -qyf
          terranova --version || exit 1

  sanitize-rpm:
    needs:
      - package-rpm
    strategy:
      matrix:
        os:
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          name: terranova-package-rpm-${{ matrix.os.target }}
          path: dist

      - name: Verify rpm x86_64 install
        run: |
          sudo apt-get install -qy rpm
          sudo rpm -i dist/terranova*x86_64.rpm
          terranova --version || exit 1

  sanitize-tarball:
    needs:
      - test
    strategy:
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - uses: actions/download-artifact@v8
        with:
          pattern: terranova-tarball-darwin-*
          merge-multiple: true
          path: dist

      - name: Verify macOS amd64 install
        run: |
          mkdir -p ~/.local/bin/
          mkdir -p ~/.local/opt/terranova
          tar -C ~/.local/opt/terranova -xzf dist/terranova-*amd64.tar.gz
          chmod +x ~/.local/opt/terranova/terranova
          ln -sf ~/.local/opt/terranova/terranova ~/.local/bin/terranova
          ~/.local/bin/terranova --version || exit 1
        if: runner.arch == 'X64'

      - name: Verify macOS arm64 install
        run: |
          mkdir -p ~/.local/bin/
          mkdir -p ~/.local/opt/terranova
          tar -C ~/.local/opt/terranova -xzf dist/terranova-*arm64.tar.gz
          chmod +x ~/.local/opt/terranova/terranova
          ln -sf ~/.local/opt/terranova/terranova ~/.local/bin/terranova
          ~/.local/bin/terranova --version || exit 1
        if: runner.arch == 'ARM64'
