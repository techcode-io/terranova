---
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The next iteration version. This workflow will automatically perform the required version bumps"
        required: true

permissions:
  contents: read

env:
  # Ref: https://docs.astral.sh/uv/concepts/projects/sync/#checking-if-the-lockfile-is-up-to-date
  UV_FROZEN: "true"

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Build
        run: uv run poe build

      - uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v7
        with:
          name: terranova-${{ matrix.os }}
          path: "dist/*"

  release:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run poe release

  post-release:
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup github actions bot
        uses: ./.github/workflows/setup-github-bot

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Run post-release step
        run: uv run poe release:post
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ inputs.version }}
