[project]
name = "terranova"
version = "0.7.3-dev"
description = "Terranova is a thin wrapper for Terraform that provides extra tools and logic to handle Terraform configurations at scale."
authors = [
  { name = "Adrien Mannocci", email = "adrien.mannocci@gmail.com" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "click>=8.4.2", # BSD
  "envyaml>=1.10.211231", # MIT
  "jinja2>=3.1.6", # BSD
  "jsonschema>=4.23.0", # MIT
  "mdformat>=0.7.22", # MIT
  "pyserde>=0.32.0", # MIT
  "rich>=15.0.0", # MIT
]

[project.urls]
Repository = "https://github.com/techcode-io/terranova"
Documentation = "https://github.com/techcode-io/terranova"
Tracker = "https://github.com/techcode-io/terranova/issues"

[project.scripts]
terranova = "terranova.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
  "pyinstaller>=6.22.0", # GPL-2.0: https://pyinstaller.org/en/stable/license.html
]
dev = [
  "basedpyright>=1.39.10", # MIT
  "licenseheaders>=0.8.8", # MIT
  "poethepoet>=0.48.0", # MIT
  "pre-commit>=4.6.2", # MIT
  "pytest-timeout>=2.3.1", # MIT
  "pytest-xdist>=3.6.1", # MIT
  "pytest>=9.1.1", # MIT
  "ruff>=0.16.3", # MIT
]

[tool.uv]
default-groups = ["dev", "build"]

[tool.basedpyright]
# Command/Bind expose a fluent builder API (methods return `Self` for chaining); flagging every
# non-chained call as an unused result is noise, not a real bug signal.
reportUnusedCallResult = false

[tool.poe.tasks."env:configure"]
help = "Setup project environment."
script = "scripts.tasks.env:configure"

[tool.poe.tasks."project:upgrade"]
help = "Upgrade project dependencies."
sequence = [
    { cmd = "uv sync -U" },
    { cmd = "pre-commit autoupdate" },
]

[tool.poe.tasks."project:license"]
help = "Add license header in codebase."
sequence = [
    { cmd = "licenseheaders -t .copyright.tmpl -d scripts" },
    { cmd = "licenseheaders -t .copyright.tmpl -d src/terranova --exclude src/terranova/templates/resources.md" },
]

[tool.poe.tasks."env:wipe"]
help = "Wipe project environment."
shell = """
import shutil

for path in ["build", "dist"]:
    try:
        shutil.rmtree(path)
    except FileNotFoundError as err:
        print(f"Skipping {path} deletion...")
"""
interpreter = "python"

[tool.poe.tasks.generate]
help = "Generate pyinstaller config."
script = "scripts.tasks.generate:run"

[tool.poe.tasks.lint]
help = "Lint code project."
script = "scripts.tasks.lint:run"

[tool.poe.tasks.fmt]
help = "Format code project."
sequence = [
  { cmd = "ruff check --select I --fix" },
  { cmd = "ruff format" }
]

[tool.poe.tasks.build]
deps = ["env:wipe"]
help = "Build standalone binary."
script = "scripts.tasks.build:run"

[tool.poe.tasks."test"]
help = "Run all tests."
cmd = "pytest --junitxml=reports/junit-report.xml -n=auto --timeout=900 --dist=loadgroup tests"

[tool.poe.tasks."test:e2e"]
help = "Run e2e tests."
cmd = "pytest --junitxml=reports/junit-report.xml -n=auto --timeout=900 --dist=loadgroup tests/e2e"

[tool.poe.tasks."release:pre"]
help = "Create a PR with changes for release."
script = "scripts.tasks.release:pre"

[tool.poe.tasks."release"]
help = "Create a new terranova release."
script = "scripts.tasks.release:run"

[tool.poe.tasks."release:post"]
help = "Prepare next iteration."
script = "scripts.tasks.release:post"
