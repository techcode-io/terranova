version: "1.3"

metadata:
  name: Runbook Errors Test
  description: Test resources for runbook command error paths
  url: https://github.com/techcode-io/terranova
  contact: mailto:adrien.mannocci@gmail.com

runbooks:
  - name: duplicate
    entrypoint: sh
    args:
      - ok.sh
  - name: duplicate
    entrypoint: sh
    args:
      - ok.sh
  - name: needs-env
    entrypoint: sh
    args:
      - ok.sh
    env:
      - name: REQUIRED_VAR
  - name: fails
    entrypoint: sh
    args:
      - fail.sh
