version: "1.3"

metadata:
  name: Runbook With Is Defined Test
  description: Test resource for runbook with if is_defined condition
  url: https://github.com/techcode-io/terranova
  contact: mailto:adrien.mannocci@gmail.com

runbooks:
  - name: check-optional-env
    entrypoint: sh
    args:
      - runbook.sh
    env:
      - name: OPTIONAL_VAR
        if: is_defined
